# Forge installer configuration. Schema: Locke-Werks/Forge docs/config-schema.md
#
# Paths use literal strings so a backslash stays a backslash. A TOML basic string
# would read "\b" in "{InstallDir}\bin" as a backspace.

[product]
name         = "WormholeNotes"
version      = "0.1.0"
publisher    = "Locke Werks"
description  = "A sticky note that tunnels through every window"
copyright    = "Copyright (C) 2026 Locke Werks"
url          = "https://github.com/Locke-Werks/WormholeNotes"
icon         = "assets/wormholenotes.ico"
# Stable across versions. Keys the single-instance mutex and the upgrade path, so
# it must never change.
upgrade_code = "bedb3277-cbde-4dd3-8e02-2b78b2a92f6f"
aumid        = "LockeWerks.WormholeNotes"

[install]
scope     = "machine"
dir       = '{ProgramFiles}\Locke Werks\WormholeNotes'
elevation = "required"

[ui]
license_text = """
WormholeNotes
Copyright (C) 2026 Locke Werks

This program is free software: you can redistribute it and/or modify it under the
terms of the GNU General Public License as published by the Free Software
Foundation, either version 3 of the License, or (at your option) any later
version.

This program is distributed in the hope that it will be useful, but WITHOUT ANY
WARRANTY; without even the implied warranty of MERCHANTABILITY or FITNESS FOR A
PARTICULAR PURPOSE. See the GNU General Public License for more details.

You should have received a copy of the GNU General Public License along with this
program. If not, see <https://www.gnu.org/licenses/>.

WormholeNotes is built with Qt, used under the GNU LGPL version 3. The Qt
libraries are installed as separate DLLs beside WormholeNotes.exe and can be
replaced.

The complete source is at https://github.com/Locke-Werks/WormholeNotes
"""

# Windows 10 1809. The floor Qt 6.8 supports.
[[preflight]]
type = "os_build"
min  = 17763
fail = "WormholeNotes needs Windows 10 version 1809 or newer."

# An upgrade cannot overwrite a running copy, and the uninstaller cannot delete one.
[[preflight]]
type            = "process_not_running"
name            = "WormholeNotes.exe"
restart_manager = true
fail            = "WormholeNotes is running. Quit it from the tray, then try again."

[[preflight]]
type  = "free_disk_space"
bytes = 104857600
fail  = "WormholeNotes needs about 100 MB free on the install volume."

[[options]]
id      = "start_menu"
label   = "Add a Start Menu shortcut"
detail  = "Puts WormholeNotes in the Start Menu for everyone on this machine."
default = true

[[options]]
id      = "desktop"
label   = "Add a desktop shortcut"
detail  = "Puts WormholeNotes on the shared desktop."
default = false

[[actions]]
type   = "shortcut"
target = '{InstallDir}\WormholeNotes.exe'
name   = "WormholeNotes"
when   = "start_menu"

[[actions]]
type   = "shortcut"
target = '{InstallDir}\WormholeNotes.exe'
where  = "desktop"
name   = "WormholeNotes"
when   = "desktop"

[[actions]]
type = "arp"
