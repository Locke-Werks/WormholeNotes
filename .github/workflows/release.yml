name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned. One place to bump, and a Forge release cannot silently change what
  # this job produces.
  FORGE_VERSION: v0.4.0
  QT_VERSION: '6.8.3'

# Unsigned for now: Windows SmartScreen warns on first run. Signing comes back
# when there is a certificate of our own.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches both version strings
        shell: pwsh
        run: |
          $tag   = "${{ github.ref_name }}".TrimStart('v')
          $cmake = (Select-String -Path CMakeLists.txt -Pattern 'project\(WormholeNotes VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $toml  = (Select-String -Path installer.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag  CMakeLists=$cmake  installer.toml=$toml"
          if ($tag -ne $cmake -or $tag -ne $toml) { throw "version mismatch" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build and test
        run: |
          cmake --preset vs -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build --preset release
          ctest --test-dir build/vs -C Release --output-on-failure

      # Everything under stage/ lands on the user's disk byte for byte.
      - name: Stage the payload
        shell: pwsh
        run: |
          cmake --install build/vs --config Release --prefix stage
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-system-dxc-compiler stage/WormholeNotes.exe

          # Qt and WormholeNotes link the dynamic MSVC runtime. Ship it beside
          # the exe rather than depending on the redistributable being installed.
          $vs  = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d' |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 |
                 ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' } |
                 Select-Object -First 1
          "CRT from $($crt.FullName)"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) stage/
          }

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build --config installer.toml --payload stage --stub tools/lwstub.exe `
            --out "dist/WormholeNotes-$env:VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "lwforge exited $LASTEXITCODE" }

      - name: Check the installer
        shell: pwsh
        run: |
          $setup = "dist/WormholeNotes-$env:VERSION-Setup.exe"
          # Captured whole before trimming: cutting the pipe early breaks it
          # under lwforge, which then exits non-zero on a healthy installer.
          $inspect = ./tools/lwforge.exe inspect $setup 2>&1
          $code = $LASTEXITCODE
          $inspect | Select-Object -First 12
          if ($code -ne 0) { throw "the installer cannot read its own container" }

          $report = & $setup --check-only /O:desktop=off 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) { throw "check-only exited $LASTEXITCODE`n$report" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "dist/WormholeNotes-$env:VERSION-portable-x64.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* `
            --repo "${{ github.repository }}" `
            --title "WormholeNotes ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
