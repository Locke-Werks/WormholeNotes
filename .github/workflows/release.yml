name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned. One place to bump, and a Forge release cannot silently change what
  # this job produces.
  FORGE_VERSION: v0.4.0
  QT_VERSION: '6.8.3'

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches both version strings
        shell: pwsh
        run: |
          $tag   = "${{ github.ref_name }}".TrimStart('v')
          $cmake = (Select-String -Path CMakeLists.txt -Pattern 'project\(tondo VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $toml  = (Select-String -Path installer.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          "tag=$tag  CMakeLists=$cmake  installer.toml=$toml"
          if ($tag -ne $cmake -or $tag -ne $toml) { throw "version mismatch" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build
        run: |
          cmake --preset vs -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build --preset release

      # Everything under stage/ lands on the user's disk byte for byte.
      - name: Stage the payload
        shell: pwsh
        run: |
          cmake --install build/vs --config Release --prefix stage
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-system-dxc-compiler stage/tondo.exe

          # Qt and Tondo link the dynamic MSVC runtime. Ship it beside the exe
          # rather than depending on the redistributable being installed.
          $vs  = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d' |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 |
                 ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' } |
                 Select-Object -First 1
          "CRT from $($crt.FullName)"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) stage/
          }

      # Only tondo.exe. The Qt and CRT DLLs already carry their vendors'
      # signatures, and re-signing them would replace those.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: stage
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every payload binary is signed
        shell: pwsh
        run: |
          $bad = Get-ChildItem stage -Recurse -Include *.exe, *.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0,-50} {1}" -f $_.Name, $sig.Status | Write-Host
            if ($sig.Status -ne 'Valid') { $_.Name }
          }
          if ($bad) { throw "unsigned payload: $($bad -join ', ')" }

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      # No --sign: that flag only works inside the Forge repo.
      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build --config installer.toml --payload stage --stub tools/lwstub.exe `
            --out "dist/Tondo-$env:VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "lwforge exited $LASTEXITCODE" }

      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the installer
        shell: pwsh
        run: |
          $setup = "dist/Tondo-$env:VERSION-Setup.exe"
          $sig = Get-AuthenticodeSignature $setup
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }

          # Proves signing did not orphan the appended container. Captured whole
          # before trimming: cutting the pipe early breaks it under lwforge,
          # which then exits non-zero on a healthy installer.
          $inspect = ./tools/lwforge.exe inspect $setup 2>&1
          $code = $LASTEXITCODE
          $inspect | Select-Object -First 12
          if ($code -ne 0) { throw "the signed installer cannot read its own container" }

          $report = & $setup --check-only /O:desktop=off /O:open_with=off 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) { throw "check-only exited $LASTEXITCODE`n$report" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "dist/Tondo-$env:VERSION-portable-x64.zip"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* `
            --repo "${{ github.repository }}" `
            --title "Tondo ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
