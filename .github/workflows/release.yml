name: release

on:
  push:
    tags: ['v*']

env:
  # Pinned. One place to bump, and a Forge release cannot silently change what
  # this job produces.
  FORGE_VERSION: v0.4.0
  WEB_EXT_VERSION: '10.7.0'
  QT_VERSION: '6.8.3'

# Signed through Azure Trusted Signing with the Specter Point certificate,
# until Locke Werks has one of its own. AZURE_TENANT_ID and AZURE_CLIENT_ID
# are repository variables, AZURE_CLIENT_SECRET a repository secret.
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # Fail at once rather than after a full build: a release is signed or
      # it does not ship.
      - name: Check the signing settings are present
        shell: pwsh
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $missing = @()
          if (-not '${{ vars.AZURE_TENANT_ID }}') { $missing += 'variable AZURE_TENANT_ID' }
          if (-not '${{ vars.AZURE_CLIENT_ID }}') { $missing += 'variable AZURE_CLIENT_ID' }
          if (-not $env:AZURE_CLIENT_SECRET) { $missing += 'secret AZURE_CLIENT_SECRET' }
          if ($missing) { throw "signing is not set up: $($missing -join ', ')" }

      - name: Check the tag matches every version string
        shell: pwsh
        run: |
          $tag   = "${{ github.ref_name }}".TrimStart('v')
          $cmake = (Select-String -Path CMakeLists.txt -Pattern 'project\(WormholeNotes VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $toml  = (Select-String -Path installer.toml -Pattern '^\s*version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $ext   = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "tag=$tag  CMakeLists=$cmake  installer.toml=$toml  extension=$ext"
          if ($tag -ne $cmake -or $tag -ne $toml -or $tag -ne $ext) { throw "version mismatch" }
          "VERSION=$tag" >> $env:GITHUB_ENV

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - name: Build and test
        run: |
          cmake --preset vs -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build --preset release
          ctest --test-dir build/vs -C Release --output-on-failure

      # Everything under stage/ lands on the user's disk byte for byte.
      - name: Stage the payload
        shell: pwsh
        run: |
          cmake --install build/vs --config Release --prefix stage
          windeployqt --release --no-translations --no-system-d3d-compiler --no-opengl-sw --no-system-dxc-compiler stage/WormholeNotes.exe

          # Qt and WormholeNotes link the dynamic MSVC runtime. Ship it beside
          # the exe rather than depending on the redistributable being installed.
          $vs  = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory | Where-Object Name -match '^\d' |
                 Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1 |
                 ForEach-Object { Get-ChildItem "$($_.FullName)\x64" -Directory -Filter 'Microsoft.VC*.CRT' } |
                 Select-Object -First 1
          "CRT from $($crt.FullName)"
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll', 'msvcp140_1.dll', 'msvcp140_2.dll') {
            Copy-Item (Join-Path $crt.FullName $dll) stage/
          }

      # Only WormholeNotes.exe. The Qt and CRT DLLs already carry their
      # vendors' signatures, and re-signing them would replace those. Signed
      # before forging, since the payload is extracted verbatim and the
      # uninstall hook pins the exe's digest.
      - name: Sign the payload
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: stage
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify every payload binary is signed
        shell: pwsh
        run: |
          $bad = Get-ChildItem stage -Recurse -Include *.exe, *.dll | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0,-50} {1}" -f $_.Name, $sig.Status | Write-Host
            if ($sig.Status -ne 'Valid') { $_.Name }
          }
          if ($bad) { throw "unsigned payload: $($bad -join ', ')" }

      - name: Fetch Forge
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:FORGE_VERSION --repo Locke-Werks/Forge --pattern '*.exe' --dir tools
          foreach ($name in 'lwforge.exe', 'lwstub.exe') {
            $sig = Get-AuthenticodeSignature "tools/$name"
            "$name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "tools/$name is $($sig.Status)" }
          }

      - name: Forge the installer
        shell: pwsh
        run: |
          ./tools/lwforge.exe build --config installer.toml --payload stage --stub tools/lwstub.exe `
            --out "dist/WormholeNotes-$env:VERSION-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "lwforge exited $LASTEXITCODE" }

      # No lwforge --sign: that flag only works inside the Forge repo.
      - name: Sign the installer
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net
          trusted-signing-account-name: specterpoint
          certificate-profile-name: specterpoint
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the installer
        shell: pwsh
        run: |
          $setup = "dist/WormholeNotes-$env:VERSION-Setup.exe"
          $sig = Get-AuthenticodeSignature $setup
          "installer: $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "installer is $($sig.Status)" }

          # Proves signing did not orphan the appended container. Captured
          # whole before trimming: cutting the pipe early breaks it under
          # lwforge, which then exits non-zero on a healthy installer.
          $inspect = ./tools/lwforge.exe inspect $setup 2>&1
          $code = $LASTEXITCODE
          $inspect | Select-Object -First 12
          if ($code -ne 0) { throw "the signed installer cannot read its own container" }

          $report = & $setup --check-only /O:desktop=off 2>&1 | Out-String
          $report
          if ($LASTEXITCODE -ne 0) { throw "check-only exited $LASTEXITCODE`n$report" }

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path stage/* -DestinationPath "dist/WormholeNotes-$env:VERSION-portable-x64.zip"

      # Mozilla signs the Firefox extension for self-distribution (unlisted),
      # which is what lets it install for good instead of until Firefox
      # closes. Skipped until the AMO API keys are repository secrets. A
      # version can be signed only once, so re-running a tag fails here.
      - name: Sign the Firefox extension
        shell: pwsh
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if (-not $env:AMO_JWT_ISSUER -or -not $env:AMO_JWT_SECRET) {
            "No AMO keys in the repository secrets; the Firefox extension is not signed."
            return
          }
          npx --yes "web-ext@$env:WEB_EXT_VERSION" sign --source-dir extension --channel unlisted `
            --api-key $env:AMO_JWT_ISSUER --api-secret $env:AMO_JWT_SECRET --artifacts-dir build/xpi
          if ($LASTEXITCODE -ne 0) { throw "web-ext sign exited $LASTEXITCODE" }
          $xpi = Get-ChildItem build/xpi -Filter *.xpi | Select-Object -First 1
          if (-not $xpi) { throw "web-ext sign produced no .xpi" }
          Copy-Item $xpi.FullName "dist/WormholeNotes-$env:VERSION-firefox.xpi"

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* `
            --repo "${{ github.repository }}" `
            --title "WormholeNotes ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md
